<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		main{
			display: grid;
			grid-column: auto auto;
		}

		.grid{
			display: grid;
			grid-template-columns: repeat(auto-fill, 1fr);
			gap: 5px;
			grid-area: 2/2/3/3;
		}
		
		.grid-item{
			background-color: hsl(0, 0%, 87%);
			text-wrap: nowrap;
		}
	</style>
</head>
<body>
	<main>
		<p style="grid-area: 1/2/2/3;">Complexity</p>
		<p style="grid-area: 2/1/3/2; writing-mode: vertical-lr;">Technology</p>
		<div class="grid">
			<div class="grid-item" style="grid-area: 1/1/2/2;">
				<span>Basic logic circuit</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 1/2/2/3;">
				<span>Basic processor</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 2/1/3/2;">
				<span>Solid logic circuit</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 2/2/3/3;">
				<span>Solid processor</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 2/3/3/4;">
				<span>Solid computer</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 2/4/3/5;">
				<span>Solid computer assembly</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 3/2/4/3;">
				<span>Advanced processor</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 3/3/4/4;">
				<span>Advanced computer</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 3/4/4/5;">
				<span>Advanced computer assembly</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 4/3/5/4;">
				<span>Nano computer</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 4/4/5/5;">
				<span>Nano computer assembly</span>
				<img src="">
			</div>
			<div class="grid-item" style="grid-area: 4/5/5/6;">
				<span>Nano super-computer</span>
				<img src="">
			</div>
		</div>
	</main>
</body>
</html>
