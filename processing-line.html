<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Processing line</title>
	<link rel="stylesheet" href="globals.css">
	<script type="module" src="dist/processing-line.js" defer></script>
	<style>
		main{
			display: grid;
			grid-template-columns: auto auto 60px auto;
			gap: 5px;
			overflow-x: auto;
			padding: 15px;
			min-height: 100px;
		}

		.slot{
			display: grid;
			grid-template-rows: subgrid;
			grid-row: 1/-1;
		}

		#add{
			grid-row: 1/-1;
		}

		#line{
			gap: 5px;
		}

		.cell{
			width: 100px;
			background-color: gray;
			flex-shrink: 0;
		}

		.machine{
			height: 100px;
		}

		#select img{
			width: 100px;
		}
	</style>
</head>
<body>
	<h1>Professional Processing line editor 😎(WIP)</h1>
	<button id="back">Back to main menu</button>
	<p>Instructions: Refresh the page to reset, Click add and select a machine to add it to the line. </p>
	<hr>
	<dialog id="select">
		<div style="display: flex; justify-content: space-between;">
			<h4>Select machine</h4>
			<button id="close">Close</button>
		</div>
		<div id="machines">
			<!--injected by js-->
		</div>
	</dialog>
	<main id="main">
		<div class="slot" id="inputs"></div>
		<section class="slot" id="line">
			<!--injected by js-->
		</section>
		<button id="add">Add</button>
		<div class="slot" id="final-outputs"></div>
	</main>
	<button id="confirm" style="background-color: greenyellow;">Confirm</button>
</body>
</html>
