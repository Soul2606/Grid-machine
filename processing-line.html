<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Processing line</title>
	<link rel="stylesheet" href="globals.css">
	<script type="module" src="dist/processing-line.js" defer></script>
	<style>
		main{
			display: flex;
			gap: 5px;
			overflow-x: auto;
			padding: 15px;
		}

		#line{
			display: flex;
			gap: 5px;
		}

		.cell{
			width: 100px;
			background-color: gray;
			flex-shrink: 0;
		}

		.machine{
			height: 100px;
		}

		#select img{
			width: 100px;
		}

		.inventory-grid-cell{
			background-color: var(--surface-3-color);
			background-size: cover;
			margin: 2px;
			width: 80px;
			height: 80px;
			user-select: none;
			border-width: 2px; 
			border-style: inset;
			border-color: var(--border-color);
			display: flex;
			align-items: end;
		}
	</style>
</head>
<body>
	<h1>Processing line editor (WIP)</h1>
	<button id="back">Back to main menu</button>
	<hr>
	<dialog id="select">
		<div style="display: flex; justify-content: space-between;">
			<h4>Select machine</h4>
			<button id="close">Close</button>
		</div>
		<div id="machines">
			<!--injected by js-->
		</div>
	</dialog>
	<main>
		<div class="slot item" id="inputs"></div>
		<section id="line">
			<!--injected by js-->
		</section>
		<button id="add">Add</button>
		<div class="slot item" id="final-outputs"></div>
	</main>
</body>
</html>
