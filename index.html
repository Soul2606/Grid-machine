	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>

<body>
	<div id="mouse-icon" style="display: none;"></div>
	<div style="display: flex;">
		<div id="side-menu-container" style="width: 320px; flex-shrink: 0; position: relative;">
			<div id="side-menu" class="side-menu" style="width: 300px;">
				<button id="side-menu-width-button" class="side-menu-width-button"></button>
				<div style="flex-grow: 1;">
					<div style="display: flex;">
						<button id="side-menu-inventory-button" class="side-menu-header-button">Inventory</button>
						<button id="side-menu-machines-button" class="side-menu-header-button">Machines</button>
						<button id="side-menu-recipes-button" class="side-menu-header-button">Recipes</button>
					</div>
					<div id="inventory-grid" class="side-menu-grid">
						<!--Code injected by js-->
					</div>
					<div id="machines-grid" class="side-menu-grid" style="display: none;">
						<!--Code injected by js-->
					</div>
				</div>
			</div>
		</div>
		<main>
			<h2>Exploration</h2>
			<button id="extract-starter">Starter</button>
			<div style="height: 100px;"></div>
			<h2>Machine Line</h2>
			<div id="machine-line0" class="machine-line">
				<div style="grid-area: 1/1/2/2; width: 100px; height: 100px; border: dashed gray 2px;"></div>
				<div style="grid-area: 1/2/2/3; width: 25px; height: 100px; background-color: rgba(126, 126, 126, 0.2); border: solid gray 2px; display: flex; align-items: center; justify-content: center; color: gray; font-size: large; pointer-events: none; user-select: none;">+</div>
				<div style="grid-area: 2/1/3/2; width: 100px; height: 25px; background-color: rgba(126, 126, 126, 0.2); border: solid gray 2px; display: flex; align-items: center; justify-content: center; color: gray; font-size: large; pointer-events: none; user-select: none;">+</div>
				<!--Code injected here-->
			</div>
		</main>
	</div>
</body>
</html>
